name: Daily Instagram Tracker

on:
  schedule:
    # Corre todos os dias às 09:00 UTC (Formato Cron)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite também correr manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install instaloader gspread oauth2client

      - name: Executar Script de Tracking
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          # Reconstitui o ficheiro de credenciais a partir dos segredos do GitHub
          echo "$GOOGLE_CREDS" > google_credentials.json
          python tracker.py