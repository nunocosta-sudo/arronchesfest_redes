name: Daily Instagram Tracker

on:
  schedule:
    # Executa automaticamente todos os dias às 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite a execução manual através do botão "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client

      - name: Executar Script de Tracking
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          INSTA_SESSION_ID: ${{ secrets.INSTA_SESSION_ID }}
        run: |
          echo "$GOOGLE_CREDS" > google_credentials.json
          python tracker.py