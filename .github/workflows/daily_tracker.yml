name: Daily Instagram Tracker

on:
  schedule:
    # Executa automaticamente todos os dias às 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite a execução manual através do botão "Run workflow"

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Instalar dependências
        run: pip install requests gspread

      - name: Executar script de tracking
        run: python tracker.py
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
          FAKE_FOLLOWERS: "1234"  # descomenta para testar só o Google Sheet